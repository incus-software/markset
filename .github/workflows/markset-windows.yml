name: Markset Windows build

# Unsigned Windows installer for testing. Runs on every push and pull request
# in the Markset repository and can be started by hand from the Actions tab.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: markset-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository != 'OpenAEC-Foundation/open-pdf-studio'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: open-pdf-studio
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-pdf-studio/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit and quality tests
        run: |
          npm run test:quality
          npm run test:unit

      - name: Build pdfium-worker sidecar
        shell: pwsh
        working-directory: .
        run: |
          cargo build --release -p pdfium-worker
          New-Item -ItemType Directory -Force open-pdf-studio/src-tauri/binaries | Out-Null
          Copy-Item target/release/pdfium-worker.exe open-pdf-studio/src-tauri/binaries/pdfium-worker-x86_64-pc-windows-msvc.exe -Force

      - name: Build installer (unsigned)
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: markset-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # After the upload, so a failing Rust test still leaves an installer to
      # try. Tests link against the dynamic CRT (tesseract-rs is built for it;
      # the workspace's +crt-static only suits the release app, see
      # render-regression.yml) in their own target dir, so the installer's
      # build cache is not thrown away.
      #
      # Test binaries have no embedded manifest, so Windows would not give them
      # Common Controls v6, which Tauri's dialogs import; they would stop at
      # start-up with 0xc0000139. Build them first, put
      # .github/test-binary.manifest next to each one, then run them. Cargo
      # reports where each test binary is (--message-format=json), so this
      # does not depend on its folder layout (Rust 1.100 moved them out of
      # debug/deps).
      # The two screenshot tests need a PDFium library the test binary cannot
      # find; they are skipped.
      - name: Rust tests
        shell: pwsh
        working-directory: .
        env:
          RUSTFLAGS: -C target-feature=-crt-static
          CARGO_TARGET_DIR: target/rust-tests
        run: |
          $messages = cargo test --no-run --message-format=json-diagnostic-rendered-ansi -p open-pdf-studio -p open-pdf-cad
          $code = $LASTEXITCODE
          $parsed = $messages | ForEach-Object { $_ | ConvertFrom-Json }
          # With JSON output the compiler's errors are in $messages, not the log.
          $parsed | Where-Object { $_.reason -eq 'compiler-message' -and $_.message.level -eq 'error' } |
            ForEach-Object { Write-Host $_.message.rendered }
          if ($code) { exit $code }
          $tests = $parsed |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } |
            ForEach-Object { $_.executable }
          if (-not $tests) { Write-Error 'cargo reported no test binaries'; exit 1 }
          foreach ($exe in $tests) {
            Copy-Item .github/test-binary.manifest "$exe.manifest" -Force
          }
          Write-Host "Manifest added to $(@($tests).Count) test binaries"
          cargo test -p open-pdf-studio -p open-pdf-cad -- --skip mcp_server::tests::tool_screenshot
